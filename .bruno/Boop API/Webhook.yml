runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = require('uuid');
        // Generate random delivery ID
        req.setHeader('X-Github-Delivery', uuid.v4());

        if (bru.isSafeMode()) {
          console.error("Request signing is only available using developer mode.");
          return;
        }
        const crypto = require('crypto');
        // Sign the request with a dummy key
        const debug_secret="test"
        const stringBody = JSON.stringify(req.body);
        const signature = crypto.createHmac("sha256", debug_secret).update(stringBody).digest("hex");
        req.setHeader('X-Hub-Signature-256', `sha256=${signature}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
