info:
  name: Status
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8004/boop/api/status
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the Status schema", function () {
          const statusSchema = {
            type: "object",
            properties: {
              projects: { type: "integer" },
              uptime: { type: "integer" },
              nodeVer: { type: "string" },
              system: { 
                type: "string",
                enum: ["linux", "win32"]
              },
              arch: { type: "string" }
            },
            additionalProperties: false,
            get required() {
              return Object.keys(this.properties)
            },
          };

          expect(res.getBody()).to.have.jsonSchema(statusSchema, { allErrors: true });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
