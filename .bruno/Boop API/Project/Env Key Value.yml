info:
  name: Env Key Value
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:8004/boop/api/projects/{{PROJECT}}/env/{{key}}
  body:
    type: form-urlencoded
    data:
      - name: value
        value: bar
  auth: inherit

runtime:
  variables:
    - name: key
      value: FOO
  scripts:
    - type: tests
      code: |-
        test("response is accepted", function () {
            expect(res.getStatus()).to.equal(202);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
