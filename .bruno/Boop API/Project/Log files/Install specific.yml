info:
  name: Install specific
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8004/boop/api/projects/{{PROJECT}}/logs/install/:logTime
  params:
    - name: step
      value: "0"
      type: query
      disabled: true
    - name: logTime
      value: "1787657902756"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the Install Log schema", function () {
          const searchParams = new URLSearchParams(req.getQueryString());
          if (searchParams.has("step")) {
            const outputSchema = {
                type: "string"
            };
            expect(res.getBody()).to.have.jsonSchema(outputSchema, { allErrors: true });
          }
          else {
            const logSchema = {
              type: "object",
              properties: {
                  time: { type: "integer" },
                  ref: { type: "string", format: "uuid"},
                  steps: {
                      type: "array",
                      uniqueItems: true,
                      items: {
                          type: "object",
                          properties: {
                              cmd: { type: "string" },
                              log: { type: "string" },
                              exitCode: { type: "integer", nullable: true },
                              startTime: { type: "integer" },
                              exitTime: { type: "integer" },
                              killed: { type: "boolean" },
                          },
                          additionalProperties: false,
                          get required() {
                            return Object.keys(this.properties)
                          }
                      },
                  }
              },
              additionalProperties: false,
              get required() {
                return Object.keys(this.properties)
              }
            };
            expect(res.getBody()).to.have.jsonSchema(logSchema, { allErrors: true });
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
