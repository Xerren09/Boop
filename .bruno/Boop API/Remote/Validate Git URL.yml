info:
  name: Validate Git URL
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8004/boop/api/remote/validateUrl?url=https://github.com/Xerren09/testAP
  params:
    - name: url
      value: https://github.com/Xerren09/testAP
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("validate doesn't time out on server", function () {
          expect(res.getResponseTime()).to.be.lessThan(30000);
        });

        test("correctly validates url", async function () {
          const searchParams = new URLSearchParams(req.getQueryString());  
          if (searchParams.has("url")) {
            const url = searchParams.get("url");
            if (url === "https://github.com/Xerren09/testAP") {
              expect(res.getStatus()).to.equal(404);
            }
            else if (url === "https://github.com/Xerren09/testAPI") {
              expect(res.getStatus()).to.equal(200);
            }
            else {
              const check = await fetch(url);
              if (check.ok) {
                expect(res.getStatus()).to.equal(200);
              }
              else {
                expect(res.getStatus()).to.equal(404);
              }
            }
          }
          else {
            expect(res.getStatus()).to.equal(404);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
