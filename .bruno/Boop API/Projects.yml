info:
  name: Projects
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8004/boop/api/projects
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const { projectTypeSchema } = require("./CommonSchemas.js");

        test("response matches the Projects List schema", function () {
            const projectsSchema = {
                type: "array",
                uniqueItems: true,
                items: {
                    type: "object",
                    properties: {
                        name: { type: "string" },
                        remote: { type: "string", format: "uri" },
                        type: projectTypeSchema,
                        deployed: { type: "boolean" },
                        lastEventTime: { type: "integer" }
                    },
                    additionalProperties: false,
                    get required() {
                      return Object.keys(this.properties)
                    }
                }
            };
            expect(res.getBody()).to.have.jsonSchema(projectsSchema, { allErrors: true });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
